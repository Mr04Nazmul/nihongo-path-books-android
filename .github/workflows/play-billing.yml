name: Play Billing draft verification
on:
  push:
    branches: ['billing/nihongo-premium']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
        working-directory: android-app/backend
      - run: node --test android-app/test/play-billing.test.mjs
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
        working-directory: android-app
        env:
          BOOKS_LIVE_ADS: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Play-Billing-draft-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Play-Billing-verification-reports
          path: android-app/app/build/reports
