name: iOS · native build and simulator checks
on:
  push:
    branches: ['ios/nihongo-path-1.0.0', 'ios/nihongo-path-1.20.3']
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios/NihongoPath
          xcodegen generate
      - name: Build and test native iOS application without signing
        working-directory: ios/NihongoPath
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,ds in data["devices"].items() if "iOS" in runtime for d in ds if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild -project NihongoPath.xcodeproj -scheme NihongoPath -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test | tee build-test.log
      - name: Launch real simulator build and capture home
        working-directory: ios/NihongoPath
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/Build/Products/Debug-iphonesimulator/NihongoPath.app
          xcrun simctl launch "$SIMULATOR_ID" online.devnazu.books.ios
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot iPhone-home.png
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/NihongoPath.app NihongoPath-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NihongoPath-iOS-simulator-verification
          path: |
            ios/NihongoPath/build-test.log
            ios/NihongoPath/TestResults.xcresult
            ios/NihongoPath/iPhone-home.png
            ios/NihongoPath/NihongoPath-iOS-Simulator.zip
          retention-days: 30
  device-release:
    if: github.ref == 'refs/heads/ios/nihongo-path-1.20.3'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios/NihongoPath
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone Release
        working-directory: ios/NihongoPath
        run: |
          set -o pipefail
          xcodebuild -project NihongoPath.xcodeproj -scheme NihongoPath \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO build
      - name: Verify device bundle and IPA structure
        working-directory: ios/NihongoPath
        run: |
          set -euo pipefail
          app=device-build/Build/Products/Release-iphoneos/NihongoPath.app
          plist="$app/Info.plist"
          plutil -lint "$plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")
          platform=$(/usr/libexec/PlistBuddy -c 'Print CFBundleSupportedPlatforms:0' "$plist")
          test "$bundle" = online.devnazu.books.ios
          test "$platform" = iPhoneOS
          test ! -e "$app/embedded.mobileprovision"
          xcrun lipo "$app/$executable" -verify_arch arm64
          build_info=$(xcrun vtool -show-build "$app/$executable")
          echo "$build_info"
          echo "$build_info" | grep -Eq "platform[[:space:]]+IOS$"
          xcrun otool -L "$app/$executable"
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -name Info.plist -print0 |
              while IFS= read -r -d '' framework_plist; do
                plutil -lint "$framework_plist"
                framework_bin=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$framework_plist")
                xcrun lipo "$(dirname "$framework_plist")/$framework_bin" -verify_arch arm64
              done
          fi
          package=$(mktemp -d)
          mkdir "$package/Payload"
          ditto "$app" "$package/Payload/NihongoPath.app"
          (cd "$package" && ditto -c -k Payload checkpoint.ipa)
          unzip -tq "$package/checkpoint.ipa"
          unzip -p "$package/checkpoint.ipa" Payload/NihongoPath.app/Info.plist |
            cmp - "$plist"
