<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nihongo Path Books</title><style>
@font-face{font-family:book;src:url(fonts/NotoSansBengali-Regular.woff2)}*{box-sizing:border-box}body{margin:0;background:#faf7f0;color:#242328;font:16px book,system-ui,sans-serif}header{padding:20px 18px 10px;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}button,input{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit}nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;position:sticky;top:0;background:#faf7f0;z-index:1}nav button{white-space:nowrap;border-radius:30px;background:#eeebe4;padding:9px 16px;font-size:13px}nav .active{background:#111820;color:white}#search{margin:8px 16px;width:calc(100% - 32px);padding:13px;border:1px solid #ddd4c9;border-radius:14px;background:white}main{padding:6px 16px 30px}.row{background:#fffdf9;border-radius:15px;padding:17px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px #40342505}.word{flex:1}.word strong{font-size:23px;display:block}.reading{color:#77716e;font-size:13px;margin:5px 0}.meaning{font-size:15px}.sound{color:#d65877;font-size:23px}.save{font-size:24px}.grammar{border-left:5px solid #e36a91;display:block;background:#fbe8ed}.grammar:nth-child(4n+2){background:#e6effb;border-color:#448ed6}.grammar:nth-child(4n+3){background:#e8f2e8;border-color:#278768}.grammar:nth-child(4n){background:#fff0e2;border-color:#dc944f}.kanji-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kanji-grid .row{display:block;margin:0;min-height:170px}.character{font-family:serif;font-size:54px}.tag{font-size:12px;color:#8a817a}.notice{font-size:13px;color:#766b64;margin:10px 2px 18px}.unlock{background:#e66f82;color:white;border-radius:16px;padding:15px;width:100%;margin-top:15px}.detail{width:100%;max-width:600px;border:1px solid #dfd0bd;border-radius:20px;background:#fffaf2;color:#29252a;padding:24px;line-height:1.8}.detail::backdrop{background:#07101bcc}.detail h2{font-size:26px}.detail table{border-collapse:collapse;width:100%}.detail td{border:1px solid #e6d9ca;padding:10px}.detail button{float:right;font-size:24px}.answer{display:block;width:100%;text-align:left;border:1px solid #ded7cd;border-radius:16px;padding:15px;margin:12px 0;background:#fffcf7}.correct{background:#098263;color:white}.wrong{background:#f7d4d9}.bar{height:7px;background:#e8e0d9;border-radius:8px;margin:18px 0}.bar i{display:block;height:100%;background:#05916b;border-radius:8px}#feedback{padding:16px;border-radius:14px;background:#d2e9d3}#error{padding:24px;line-height:1.7}
.detail:not([open]){display:none}.detail[open]{display:block;position:fixed;top:8%;left:4%;right:4%;width:92%;max-height:84vh;overflow:auto;z-index:10;box-shadow:0 0 0 100vmax #07101b99}</style></head><body><header><h1 id="title">Books</h1><button id="searchToggle" aria-label="Search">⌕</button></header><input id="search" placeholder="শব্দ খুঁজুন / Search" hidden><nav id="tabs"></nav><main id="content" aria-live="polite"></main><dialog id="detail" class="detail"></dialog><script>
'use strict';const q=new URLSearchParams(location.search),level=q.get('level')||'N5',preview=q.get('preview')==='1',names={vocab:'Vocabulary',grammar:'Grammar',kanji:'Kanji',quiz:'Quiz'};const savedOnly=q.get('saved')==='1';let kind=q.get('section')||'vocab',data={},query='',quizIndex=0,quizScore=0,answered=false;let state;try{state=JSON.parse(localStorage.getItem('nihongo-path')||'{}')}catch{state={}}state.saved??=[];state.learned??=[];const content=document.querySelector('#content'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=e=>level+':'+e.id;function persist(){localStorage.setItem('nihongo-path',JSON.stringify(state));window.StudyNative?.saveProgress(JSON.stringify(state))}function sound(e){window.StudyNative?.speak(String(e.word||e.pattern||e.character||''))}function meaning(e){return e.meaning_bn||e.meaning||e.bn||e.meaning_en||''}function render(){document.querySelector('#title').textContent=level+' '+names[kind];document.querySelector('#tabs').innerHTML=Object.entries(names).map(([k,v])=>`<button data-tab="${k}" class="${kind===k?'active':''}">${v}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{kind=b.dataset.tab;render()});if(kind==='quiz'){quiz();return}const rows=(data[kind]||[]).filter(e=>(!savedOnly||state.saved.includes(key(e)))&&JSON.stringify(e).toLowerCase().includes(query));content.innerHTML=(savedOnly?'<p class="notice">আপনার সংরক্ষিত পাঠ · লক থাকলে প্রথম ৫টির বুকমার্ক দেখা যাবে।</p>':'')+(preview?'<p class="notice">প্রথম ৫টি ফ্রি · সম্পূর্ণ বই বিজ্ঞাপন দেখে খুলুন</p>':'')+`<div class="${kind==='kanji'?'kanji-grid':''}">`+rows.map((e,i)=>`<article class="row ${kind==='grammar'?'grammar':''}" data-id="${esc(e.id)}"><div class="word" data-detail="${esc(e.id)}">${kind==='kanji'?`<div class="character" lang="ja">${esc(e.character)}</div><div class="reading">${esc([...(e.kunyomi||[]),...(e.onyomi||[])].join(' ・ '))}</div>`:`<strong lang="ja">${esc(e.word||e.pattern)}</strong><div class="reading">${esc(e.reading||e.pattern_reading||'')}</div>`}<div class="meaning">${esc(meaning(e))}</div></div><button class="sound" data-sound="${esc(e.id)}" aria-label="উচ্চারণ শুনুন">♬</button><button class="save" data-save="${esc(e.id)}" aria-label="Bookmark">${state.saved.includes(key(e))?'♥':'♡'}</button></article>`).join('')+'</div>'+(preview?'<button class="unlock" id="unlock">বিজ্ঞাপন দেখে পুরো বই খুলুন →</button>':'');document.querySelector('#unlock')?.addEventListener('click',()=>window.StudyNative?.unlock());for(const [attr,action]of [['sound',sound],['save',e=>{state.saved=state.saved.includes(key(e))?state.saved.filter(x=>x!==key(e)):[...state.saved,key(e)];persist();render()}],['detail',detail]])document.querySelectorAll('[data-'+attr+']').forEach(b=>b.onclick=()=>action(rows.find(e=>e.id===b.dataset[attr])))}
function exampleMeaning(x){return x.bn||x.meaning||({'進む':'এগিয়ে যাওয়া; অগ্রসর হওয়া','深い':'গভীর'})[x.word]||''}
function detail(e){const d=document.querySelector('#detail');d.innerHTML=`<button id="close" aria-label="Close">×</button><p class="tag">${level} / ${names[kind]}</p><h2 lang="ja">${esc(e.word||e.pattern||e.character)}</h2><p class="reading">${esc(e.reading||e.pattern_reading||'')}</p><p>${esc(meaning(e))}</p>${e.english?`<p class="reading">${esc(e.english)}</p>`:''}${(e.components||[]).length?`<h3>শব্দের অংশ / Word parts</h3>${e.components.map(x=>`<section><strong lang="ja">${esc(x.word||'')}</strong><p class="reading">${esc(x.reading||'')}</p><p>${esc(x.meaning||'')}</p></section>`).join('')}`:''}${e.formation?`<h3>গঠন / Formation</h3><p>${esc(e.formation)}</p><p class="reading">${esc(e.formation_reading||'')}</p>`:''}${e.explanation?`<h3>ব্যবহার / Usage</h3><p>${esc(e.explanation)}</p>`:''}${kind==='kanji'?`<p>訓読み：${esc((e.kunyomi||[]).join(' ・ '))}</p><p>音読み：${esc((e.onyomi||[]).join(' ・ '))}</p>`:''}${(e.examples||[]).map(x=>`<section><p lang="ja">${esc(x.ja||x.word||'')}</p><p class="reading">${esc(x.reading||'')}</p><p>${esc(exampleMeaning(x))}</p></section>`).join('')}`;d.querySelector('#close').onclick=()=>{if(d.close)d.close();else d.removeAttribute('open')};const learned=document.createElement('button');learned.className='unlock';learned.style.float='none';learned.textContent=state.learned.includes(key(e))?'✓ শেখা হয়েছে':'শেখা হয়েছে হিসেবে রাখুন';learned.onclick=()=>{state.learned=state.learned.includes(key(e))?state.learned.filter(x=>x!==key(e)):[...state.learned,key(e)];persist();if(d.close)d.close();else d.removeAttribute('open')};d.append(learned);if(d.showModal)d.showModal();else d.setAttribute('open','')}
function quiz(){const rows=data.vocab||[];if(rows.length<2){content.textContent='Quiz unavailable';return}if(quizIndex>=rows.length){content.innerHTML=`<h2>সম্পন্ন! ${quizScore}/${rows.length}</h2><button class="unlock" id="restart">আবার শুরু করুন</button>`;document.querySelector('#restart').onclick=()=>{quizIndex=quizScore=0;quiz()};return}answered=false;const e=rows[quizIndex],choices=[e,...rows.filter(x=>x.id!==e.id).slice(0,3)].sort((a,b)=>a.id.localeCompare(b.id));content.innerHTML=`<div class="bar"><i style="width:${quizIndex/rows.length*100}%"></i></div><p class="tag">${quizIndex+1}/${rows.length}</p><h2>「${esc(e.word)}」এর অর্থ কী?</h2>${choices.map((x,i)=>`<button class="answer" data-choice="${i}">${String.fromCharCode(65+i)}　${esc(meaning(x))}</button>`).join('')}<p id="feedback" hidden></p><button class="unlock" id="next" hidden>পরবর্তী প্রশ্ন →</button>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const correct=choices[+b.dataset.choice].id===e.id;if(correct)quizScore++;b.classList.add(correct?'correct':'wrong');document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;if(choices[+x.dataset.choice].id===e.id)x.classList.add('correct')});const f=document.querySelector('#feedback');f.hidden=false;f.textContent=correct?'✓ সঠিক!':'সঠিক অর্থ: '+meaning(e);document.querySelector('#next').hidden=false});document.querySelector('#next').onclick=()=>{quizIndex++;quiz()}}
document.querySelector('#searchToggle').onclick=()=>{const s=document.querySelector('#search');s.hidden=!s.hidden;if(!s.hidden)s.focus()};document.querySelector('#search').oninput=e=>{query=e.target.value.toLowerCase();render()};fetch('data/lessons-'+level.toLowerCase()+'.json').then(r=>{if(!r.ok)throw Error('পাঠ খোলা যায়নি। ফিরে গিয়ে আবার চেষ্টা করুন।');return r.json()}).then(d=>{data=d;render()}).catch(e=>{content.textContent=e.message});
</script></body></html>
