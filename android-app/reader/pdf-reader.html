<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Reader</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f3eb;color:#28252a;font:15px system-ui,sans-serif}header{padding:20px 18px 12px;border-bottom:1px solid #dfd3c2}h1{font:25px Georgia,serif;margin:0 0 5px}p{color:#7b7168;line-height:1.6}.book{display:flex;gap:16px;align-items:center;margin:12px 16px;padding:18px;border:1px solid #e7dbce;border-radius:18px;background:#fffcf6;text-align:left;width:calc(100% - 32px);color:inherit}.cover{width:48px;height:68px;background:linear-gradient(135deg,#b65476,#492d50);color:#fff;padding:10px 6px;border-radius:4px 9px 9px 4px;font:18px Georgia,serif;flex-shrink:0}.book strong{display:block;line-height:1.5}.book small{display:block;color:#8c7b70;margin-top:7px}.controls{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:14px;position:sticky;top:0;background:#faf5edee;z-index:2}.controls button{border:1px solid #ded1c0;border-radius:20px;padding:10px 15px;background:#fffcf8;color:#352a29}#page{width:52px;border:1px solid #ddd0bd;padding:8px;border-radius:9px;background:white}canvas{display:block;max-width:100%;height:auto;margin:0 auto;background:white;box-shadow:0 4px 20px #34271a20}#status{padding:16px;text-align:center}#reader[hidden],#books[hidden]{display:none}.selection{background:#152133!important;color:#fff!important;font-size:12px}button{font:inherit;cursor:pointer}#bookTitle{font-size:13px;color:#655d55;margin:0;padding:10px 16px}#error{padding:24px;color:#a23f50}</style></head><body><header><h1 id="title">Original books</h1><span>আপনার বই, আপনার পড়ার গতি</span></header><main><div id="books"></div><section id="reader" hidden><p id="bookTitle"></p><nav class="controls"><button id="pick" class="selection">বই বাছুন</button><button id="previous" aria-label="Previous page">←</button><label><input id="page" type="number" min="1" value="1" aria-label="Page number"> / <span id="total"></span></label><button id="next" aria-label="Next page">→</button></nav><canvas id="canvas" aria-label="Book page"></canvas></section><p id="status" role="status">বইয়ের তালিকা খুলছে…</p><div id="error" role="alert"></div></main><script>
'use strict';const params=new URLSearchParams(location.search),level=params.get('level')||'N5',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('nihongo-path')||'{}')}catch{state={}}let pdf=null,pdfjs=null,current=1,task=null,sequence=0,selected=null;const status=document.querySelector('#status');document.querySelector('#title').textContent=level+' · Original Books';
function showError(e){status.textContent='';document.querySelector('#error').textContent=e.message||'বই খোলা যায়নি। সংযোগ দেখে আবার চেষ্টা করুন।'}
async function drawPage(){if(!pdf)return;const run=++sequence;if(task){task.cancel();try{await task.promise}catch{}}const page=await pdf.getPage(current);if(run!==sequence)return;const viewport=page.getViewport({scale:1}),scale=Math.min(2.5,(document.documentElement.clientWidth*(window.devicePixelRatio||1))/viewport.width),view=page.getViewport({scale}),canvas=document.querySelector('#canvas');canvas.width=view.width;canvas.height=view.height;task=page.render({canvasContext:canvas.getContext('2d'),viewport:view});try{await task.promise}catch(e){if(e.name!=='RenderingCancelledException')throw e}if(run!==sequence)return;document.querySelector('#page').value=current;document.querySelector('#total').textContent=pdf.numPages;document.querySelector('#previous').disabled=current===1;document.querySelector('#next').disabled=current===pdf.numPages;status.textContent='';localStorage.setItem('np-pdf:'+selected.pdf_url,String(current));}
async function openBook(book){try{selected=book;document.querySelector('#error').textContent='';status.textContent='বই খুলছে…';if(pdf)await pdf.destroy();if(!pdfjs){pdfjs=await import('./vendor/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='./vendor/pdf.worker.min.mjs'}if(!/^pdfs\/(?:jlpt-)?n[2-5][a-z0-9._/-]*\.pdf$/i.test(book.pdf_url)||book.pdf_url.includes('..'))throw Error('এই বইটি পাওয়া যাচ্ছে না।');const response=await fetch(book.pdf_url);if(!response.ok)throw Error('বইটি খুলতে এই লেভেলের সময় আনলক করুন।');pdf=await pdfjs.getDocument({data:new Uint8Array(await response.arrayBuffer()),isEvalSupported:false,useSystemFonts:true}).promise;current=Math.min(pdf.numPages,Math.max(1,Number(localStorage.getItem('np-pdf:'+book.pdf_url))||1));document.querySelector('#books').hidden=true;document.querySelector('#reader').hidden=false;document.querySelector('#bookTitle').textContent=book.pdf_title;document.querySelector('#page').max=pdf.numPages;await drawPage()}catch(e){showError(e)}}
document.querySelector('#pick').onclick=()=>{document.querySelector('#reader').hidden=true;document.querySelector('#books').hidden=false;status.textContent=''};document.querySelector('#previous').onclick=()=>{if(current>1){current--;drawPage().catch(showError)}};document.querySelector('#next').onclick=()=>{if(current<pdf.numPages){current++;drawPage().catch(showError)}};document.querySelector('#page').onchange=e=>{current=Math.max(1,Math.min(pdf.numPages,Number(e.target.value)||1));drawPage().catch(showError)};
fetch('data/owner-'+level.toLowerCase()+'.json').then(r=>{if(!r.ok)throw Error('এই লেভেলের বই খুলতে আগে সময় আনলক করুন।');return r.json()}).then(data=>{const books=[...new Map(['vocab','grammar','kanji'].flatMap(k=>data[k]||[]).filter(e=>e.pdf_url).map(e=>[e.pdf_url,e])).values()];document.querySelector('#books').innerHTML=books.map((e,i)=>`<button class="book" data-book="${i}"><span class="cover">${esc(level)}<br>本</span><span><strong>${esc(e.pdf_title)}</strong><small>${esc(e.pdf_total)} pages · পড়া চালিয়ে যান →</small></span></button>`).join('');document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>openBook(books[+b.dataset.book]));status.textContent=books.length?'':'এই লেভেলের মূল PDF এখন পাওয়া যাচ্ছে না।'}).catch(showError);
</script></body></html>
