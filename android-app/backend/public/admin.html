<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Books Administration</title><link rel="stylesheet" href="admin.css"><main><small>NIHONGO PATH BOOKS</small><h1>Library administration</h1><form id="login"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p id="status" role="status"></p><section id="dashboard" hidden><button id="refresh">Refresh</button><button id="logout">Sign out</button><h2>Verified activity</h2><pre id="counts"></pre><label><input id="enabled" type="checkbox">Reward ads enabled</label><h2>Level availability</h2><div id="levels"></div><h2>Balances, unlocks and redemptions</h2><pre id="access"></pre><h2>Chapter / audio draft editor</h2><p>Choose chapter or audio. Edit JSON; saved drafts require review before reader publication.</p><select id="editorKind"><option>chapter</option><option>audio</option></select><textarea id="editor" rows="12" aria-label="Content JSON"></textarea><button id="saveDraft">Save draft</button><pre id="content"></pre><h2>Reward tiers</h2><div id="tiers"></div><h2>Usage & suspicious events</h2><pre id="events"></pre></section></main><script src="admin.js"></script></html>
